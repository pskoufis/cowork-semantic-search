[project]
name = "cowork-semantic-search"
version = "0.2.0"
description = "Claude Code plugin for local semantic search over document folders"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"

dependencies = [
    "fastmcp>=2.0,<3.0",
    "sentence-transformers>=3.0,<4.0",
    # Qwen3-Embedding-0.6B requires transformers >= 4.51.0. Pin a floor so a
    # too-old transformers from another package can't silently break loading.
    "transformers>=4.51.0,<5.0",
    "lancedb>=0.20,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "openpyxl>=3.1,<4.0",
    "xlrd>=2.0,<3.0",
    "pathspec>=0.12,<1.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.25,<2.0"]
docx = ["python-docx>=1.1,<2.0"]
pptx = ["python-pptx>=1.0,<2.0"]
# libpff-python has no Apple-Silicon wheel and compiles from source — the
# Xcode command-line tools are required to install this extra.
pst = ["libpff-python>=20231205"]
msg = ["extract-msg>=0.50,<1.0"]
# Used by scripts/images_to_pdf.py to convert image files into PDFs.
# pillow-heif registers the HEIC/HEIF decoders Pillow lacks out of the box.
images = ["pillow>=10,<13", "pillow-heif>=1.0,<2.0"]
# tqdm is optional — the `csemsearch` CLI degrades to a plain counter without
# it. Headless installs (the MCP server) don't need it at all.
cli = ["tqdm>=4.66"]
all = [
    "pymupdf>=1.25,<2.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
    "libpff-python>=20231205",
    "extract-msg>=0.50,<1.0",
    "pillow>=10,<13",
    "pillow-heif>=1.0,<2.0",
    "tqdm>=4.66",
]
dev = ["pytest>=8.0", "xlwt>=1.3,<2.0"]

[tool.setuptools.packages.find]
include = ["server*", "cli*"]

[project.scripts]
semantic-search-server = "server.main:run"
csemsearch = "cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
